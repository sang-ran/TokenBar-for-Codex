name: Focused feature request
description: Suggest an improvement to TokenBar's token or quota monitoring
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        TokenBar intentionally stays focused. Please describe the problem before proposing a UI or implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What focused change would solve the problem?
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Codex account type
      options:
        - Subscription
        - API key
        - Not account-specific
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included credentials, conversation content or local Codex logs.
          required: true
