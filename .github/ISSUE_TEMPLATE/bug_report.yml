name: Bug report
description: Report a reproducible TokenBar problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, conversation content, or unredacted files from `~/.codex`.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
