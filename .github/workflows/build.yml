name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: swift test

      - name: Package Apple Silicon app
        run: |
          TOKENBAR_ARCH=arm64 Scripts/package.sh release \
            ".build/dist/TokenBar for Codex.app"
          Scripts/create_archive.sh \
            ".build/dist/TokenBar for Codex.app" \
            ".build/dist/TokenBar-for-Codex.zip"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: TokenBar-for-Codex-arm64
          path: |
            .build/dist/TokenBar-for-Codex.zip
            .build/dist/TokenBar-for-Codex.zip.sha256
